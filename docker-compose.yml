version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: talkingcode
      POSTGRES_PASSWORD: talkingcode
      POSTGRES_DB: talkingcode
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talkingcode"]
      interval: 5s
      timeout: 5s
      retries: 5

