name: Build, Push and Deploy data pipelines

on:
  push:
    branches:
      - main
      - master
    paths:
      - "pipelines/**"
      - "docker.pipelines.yml"
      - "docker/pipelines/Dockerfile"
      - "compose.pipelines.override.yml"
      - ".github/workflows/pipelines.yaml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: deployment
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Push Docker image to Docker Hub
        run: docker compose -f compose.pipelines.yml -f compose.pipelines.override.yml build --push

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: deployment
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Create a .env file with Infisical secrets
        run: |
          echo "INFISICAL_CLIENT_ID=${{ secrets.INFISICAL_CLIENT_ID }}" >> .env
          echo "INFISICAL_CLIENT_SECRET=${{ secrets.INFISICAL_CLIENT_SECRET }}" >> .env
          echo "INFISICAL_PROJECT_ID=${{ secrets.INFISICAL_PROJECT_ID }}" >> .env
          echo "INFISICAL_URL=${{ secrets.INFISICAL_URL }}" >> .env
          echo "TELEMETRY_ENABLED=true" >> .env
          echo "TELEMETRY_ENDPOINT=${{ secrets.TELEMETRY_ENDPOINT }}" >> .env
          echo "INFISICAL_ENVIRONMENT=prod" >> .env
          echo "INFISICAL_ENABLED=true" >> .env

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Create project directory if it doesn't exist
        run: ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} 'mkdir -p ~/${{ vars.PROJECT }}'

      - name: Copy compose files
        run: scp -o StrictHostKeyChecking=no compose.pipelines.yml .env ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/${{ vars.PROJECT }}

      - name: Deploy to server
        run: ssh -o StrictHostKeyChecking=accept-new ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} 'cd ~/${{ vars.PROJECT }} && docker compose -f compose.pipelines.yml --env-file .env up -d --pull always && rm compose.pipelines.yml'
