[tool.poetry]
name = "talkingcode-pipelines"
version = "0.1.0"
description = "Data pipelines for the TalkingCode project. The responsibilities of this subproject are downloading the git history, making the embeddings and scheduling this in a pipeline run."
authors = ["ChidiRNweke <chidi125@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "talkingcode", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pygithub = "^2.3.0"
python-dotenv = "^1.0.1"
sqlalchemy = "^2.0.30"
alembic = "^1.13.1"
openai = "^1.30.5"
pgvector = "^0.2.5"
aiohttp = "^3.9.5"
talkingcode-shared = {path = "../shared"}
tiktoken = "^0.8.0"
langchain-text-splitters = "^0.3.4"
aiosqlite = "^0.20.0"
tenacity = "^9.0.0"
pydantic = {extras = ["email"], version = "^2.10.4"}
asyncpg = "^0.30.0"
openai-agents = "^0.0.3"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.4"
datamodel-code-generator = "^0.26.4"
ruff = "^0.8.4"

[tool.ruff.lint]
extend-select = ["I"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

