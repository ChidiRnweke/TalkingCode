[tool.poetry]
name = "talkingcode-backend"
version = "0.1.0"
description = "The backend of the TalkingCode project"
authors = ["ChidiRNweke <chidi125@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "talkingcode", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
talkingcode-shared = {path = "../shared"}
fastapi = "^0.111.0"
openai = "^1.31.0"
aiohttp = "^3.9.5"
python-dotenv = "^1.0.1"
asyncpg = "^0.30.0"
qdrant-client = "1.12.1"
alembic = "^1.14.0"
aiosqlite = "^0.20.0"
tiktoken = "^0.8.0"
openai-agents = "^0.0.3"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.4"
pytest = "^8.2.2"
pytest-asyncio = "^0.23.7"
testcontainers = {extras = ["postgres"], version = "^4.5.1"}
ruff = "^0.8.4"

[tool.ruff.lint]
extend-select = ["I"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
